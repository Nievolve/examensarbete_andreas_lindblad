[package]
name = "tree-sitter-structured-text"
description = "For IEC 61131-3 language Structured Text"
version = "0.0.1"
authors = ["Andreas Lindblad <andreaslindblad@protonmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "structured-text"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/nievolve/structured_text_tree-sitter"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
